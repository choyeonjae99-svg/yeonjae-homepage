<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조연재 — 메인 시안 (시냅스 프로토타입)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400&family=Silkscreen:wght@400&display=swap">
<style>
body{margin:0;background:#1C1B1F;font-family:'IBM Plex Sans KR',sans-serif;font-weight:400;color:#EEE9EB}
a{color:#9E999D;text-decoration:none;transition:color .2s}a:hover{color:#EEE9EB}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-16px,8px)}}
.drift{animation:drift 22s steps(24) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(4);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s steps(8) infinite}
@keyframes travel{from{offset-distance:0%}to{offset-distance:100%}}
.sig{position:absolute;left:0;top:0;width:6px;height:6px;background:#E0306A;animation:travel 9s steps(180) infinite}
.s1{offset-path:path('M137 456 L299 514 L475 517 L578 371 L767 345 L958 394 L1143 457 L1323 409')}
.s2{offset-path:path('M152 131 L293 241 L405 346 L578 371 L767 345 L740 542 L887 591 L888 799 L1027 741');animation-duration:11s}
.s3{offset-path:path('M1349 96 L1193 286 L1033 257 L919 117 L757 174 L638 63 L487 178 L364 84 L152 131');animation-duration:13s}
.s4{offset-path:path('M90 802 L296 676 L467 697 L620 705 L728 820 L888 799 L1027 741 L1169 797 L1351 790');animation-duration:10s}
@keyframes eq{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.bar{display:block;width:3px;height:12px;background:#E0306A;transform-origin:bottom;transform:scaleY(.25)}
.bar.on{animation:eq .8s steps(4) infinite alternate}
@media (prefers-reduced-motion:reduce){.drift,.pulse,.sig,.bar.on{animation:none}}
html,body{height:100%}
.stage{position:fixed;inset:0;overflow:hidden;background-color:#1C1B1F;background-image:radial-gradient(#2E2C32 1px,transparent 1.5px);background-size:16px 16px}
.field{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1))}
header{position:fixed;left:48px;right:48px;top:32px;height:44px;display:flex;align-items:center;justify-content:space-between;z-index:2}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;color:#EEE9EB}
.logo i{display:block;width:8px;height:8px;background:#E0306A}
.right{display:flex;align-items:center;gap:36px}
nav{display:flex;gap:28px;font-size:14px}
.snd{height:44px;padding:0 4px;display:flex;gap:10px;align-items:center;background:transparent;border:0;color:#9E999D;font-family:Silkscreen,monospace;font-size:11px;letter-spacing:.06em;cursor:pointer}
.eq{display:flex;gap:2px;align-items:flex-end;height:12px}
footer{position:fixed;left:48px;right:48px;bottom:32px;display:flex;align-items:center;justify-content:space-between;z-index:2}
footer .cap{font-size:13px;color:#9E999D}
footer .lbl{font-family:Silkscreen,monospace;font-size:11px;letter-spacing:.08em;color:#9E999D}
@media (max-width:640px){
header{left:24px;right:24px;top:20px}footer{left:24px;right:24px;bottom:24px}
.right{gap:16px}nav{gap:16px;font-size:13px}
footer .cap{font-size:12px}footer .lbl{display:none}
}
</style>
</head>
<body>

</g>

<header>
<a class="logo" href="#"><i></i>조연재</a>
<div class="right">
<nav>
<a href="#">소개</a>
<a href="#">포트폴리오</a>
<a href="#">그 외 작업물</a>

<button class="snd" id="snd" aria-pressed="false" aria-label="배경음악 켜고 끄기">
<span class="eq"><span class="bar" style="animation-delay:0s"></span><span class="bar" style="animation-delay:.25s"></span><span class="bar" style="animation-delay:.5s"></span></span>
<span id="sndLabel">SOUND OFF</span>
</button>
</div>
</header>
<footer>
<span class="cap">게임 연구 · 사용자 연구 · 시각 디자인</span>
<span class="lbl">SCROLL</span>
</footer>
<script>
// 화면 크기에 맞춰 1440x900 연결망을 꽉 채우도록 확대/축소
function fit(){
  var s=Math.max(window.innerWidth/1440,window.innerHeight/900);
  document.querySelector('.field').style.setProperty('--s',s);
}
window.addEventListener('resize',fit);fit();
// 사운드 버튼 (실제 음원 연결은 구현 단계에서)
var btn=document.getElementById('snd'),on=false;
btn.addEventListener('click',function(){
  on=!on;
  btn.setAttribute('aria-pressed',on);
  document.getElementById('sndLabel').textContent=on?'SOUND ON':'SOUND OFF';
  btn.querySelectorAll('.bar').forEach(function(b){b.classList.toggle('on',on);});
});
</script>
